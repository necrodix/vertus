<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar diagnóstico | Virtus</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles/styles.css?v=20260820-2"></head><body class="inner-page"><main id="main"><section class="section diagnosis-section" id="diagnostico"><div class="container diagnosis-grid"><div class="diagnosis-copy reveal"><span class="eyebrow">DIAGNÓSTICO</span><h1 data-i18n="diagnosis.title">Convirtamos tu reto financiero en una estrategia.</h1><p data-i18n="diagnosis.body">Cuéntanos brevemente qué necesita resolver tu empresa. El formulario nos ayuda a preparar una conversación más útil.</p><div class="contact-card"><span data-i18n="diagnosis.contact">Contacto</span><a href="https://virtusadp.com" target="_blank" rel="noopener">virtusadp.com</a></div></div><form class="diagnosis-form reveal" id="diagnosisForm" novalidate><div class="field"><label for="name" data-i18n="form.name">Nombre</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="company" data-i18n="form.company">Empresa</label><input id="company" name="company" autocomplete="organization" required></div><div class="field"><label for="email" data-i18n="form.email">Correo</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="phone" data-i18n="form.phone">Teléfono</label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div><div class="field full"><label for="need" data-i18n="form.need">¿Qué necesita resolver?</label><select id="need" name="need" required><option value="" data-i18n="form.choose">Selecciona una opción</option><option data-i18n="form.o1">Liquidez / Financiamiento</option><option data-i18n="form.o2">Riesgo cambiario / Mercado</option><option data-i18n="form.o3">Consultoría empresarial</option><option data-i18n="form.o4">Otro</option></select></div><div class="field full"><label for="billing" data-i18n="form.billing">Facturación aproximada</label><input id="billing" name="billing" data-i18n-placeholder="form.billingPlaceholder" placeholder="Indica una cifra o rango aproximado" required></div><label class="consent full"><input type="checkbox" id="privacy" required><span data-i18n="form.privacy">Acepto que mis datos sean utilizados para dar seguimiento a mi solicitud.</span></label><div class="form-footer full"><button class="btn btn-primary" type="submit" data-i18n="form.submit">Solicitar diagnóstico financiero</button><p class="form-status" id="formStatus" role="status" aria-live="polite"></p></div></form></div></section></main><script src="js/layout.js?v=20260820-2"></script><script src="js/script.js?v=20260820-2"></script></body></html>
